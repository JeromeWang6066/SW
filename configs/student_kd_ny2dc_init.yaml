# Group 2 — NY teacher weights copied onto the DC student, then KD (λ = 1).
# The teacher copy stays frozen. Pearson ρ̃ multiplier stays OFF (Group 3).
_base: default.yaml

experiment:
  group: 2
  id: G2-NY2DC-init
  role: student_kd

cities:
  source: ny
  target: dc

splits:
  few_shot_days: 3

kd:
  enabled: true
  lambda_kd: 1.0
  init_from_teacher: true
  teacher_checkpoint: checkpoints/teacher_ny_stnet.pt
  freeze_teacher: true
  pearson_multiplier: false   # Group 3 hook

paths:
  checkpoint_name: student_kd_ny2dc_init.pt

train:
  epochs: 50
  batch_size: 8
  weight_decay: 5.0e-5

seed: 42
