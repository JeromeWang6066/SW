# Group 2 — standard KD: frozen CHI teacher → DC student (STBaT 3-day).
# Pearson ρ̃ multiplier stays OFF (Group 3).
_base: default.yaml

experiment:
  group: 2
  id: G2-CHI2DC
  role: student_kd

cities:
  source: chi
  target: dc

splits:
  few_shot_days: 3

kd:
  enabled: true
  lambda_kd: 1.0
  teacher_checkpoint: checkpoints/teacher_chi_stnet.pt
  freeze_teacher: true
  pearson_multiplier: false   # Group 3 hook

paths:
  checkpoint_name: student_kd_chi2dc.pt

train:
  epochs: 50
  batch_size: 8
  weight_decay: 5.0e-5

seed: 42
