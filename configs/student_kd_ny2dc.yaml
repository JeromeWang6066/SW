# Group 2 — standard KD: frozen NY teacher → DC student (STBaT 3-day).
# Pearson ρ̃ multiplier stays OFF (Group 3).
_base: default.yaml

experiment:
  group: 2
  id: G2-NY2DC
  role: student_kd

cities:
  source: ny
  target: dc

splits:
  few_shot_days: 3

kd:
  enabled: true
  lambda_kd: 1.0
  teacher_checkpoint: checkpoints/teacher_ny_stnet.pt
  freeze_teacher: true
  pearson_multiplier: false   # Group 3 hook

paths:
  checkpoint_name: student_kd_ny2dc.pt

train:
  epochs: 50
  batch_size: 16

seed: 42
