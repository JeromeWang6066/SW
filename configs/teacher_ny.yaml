# Group 1 — source teacher on NY (CrossTReS ST-Net).
_base: default.yaml

experiment:
  group: 1
  id: G1-src-ny
  role: teacher

cities:
  source: ny
  target: null

kd:
  enabled: false
  pearson_multiplier: false

paths:
  checkpoint_name: teacher_ny_stnet.pt

train:
  epochs: 50
  batch_size: 8   # 8 GB laptop; upstream default 32 assumes ~10 GB
  weight_decay: 5.0e-5

seed: 42
