# Source teacher: New York weekdays only. Seed 42. New checkpoint directory.
_base: ../default.yaml

experiment:
  group: calendar
  id: cal-teacher-ny-weekday
  role: teacher

cities:
  source: ny
  target: null

calendar:
  train_labels: weekday
  early_stop: weekday

kd:
  enabled: false
  pearson_multiplier: false

paths:
  checkpoint_dir: checkpoints/calendar
  log_dir: logs/calendar
  checkpoint_name: teacher_ny_weekday.pt

train:
  epochs: 50
  batch_size: 8
  weight_decay: 5.0e-5

seed: 42
