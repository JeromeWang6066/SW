# Standard distillation, lambda 1. Frozen old Chicago teacher. Student starts from random weights.
_base: ../default.yaml

experiment:
  group: calendar
  id: cal-kd-chi
  role: student_kd

cities:
  source: chi
  target: dc

splits:
  few_shot_days: 0

calendar:
  train_labels: dc_wd3_we2
  early_stop: all

kd:
  enabled: true
  lambda_kd: 1.0
  teacher_checkpoint: checkpoints/teacher_chi_stnet.pt
  freeze_teacher: true
  init_from_teacher: false
  pearson_multiplier: false

paths:
  checkpoint_dir: checkpoints/calendar
  log_dir: logs/calendar
  checkpoint_name: kd_chi_wd3we2.pt

train:
  epochs: 50
  batch_size: 8
  weight_decay: 5.0e-5

seed: 42
