# Fine-tune the old Chicago teacher on Washington's 120 labels. Old weights are read-only.
_base: ../default.yaml

experiment:
  group: calendar
  id: cal-finetune-chi
  role: finetune

cities:
  source: chi
  target: dc

splits:
  few_shot_days: 0

calendar:
  train_labels: dc_wd3_we2
  early_stop: all

kd:
  enabled: false
  pearson_multiplier: false
  teacher_checkpoint: checkpoints/teacher_chi_stnet.pt

paths:
  checkpoint_dir: checkpoints/calendar
  log_dir: logs/calendar
  checkpoint_name: finetune_chi_wd3we2.pt

train:
  epochs: 50
  batch_size: 8
  weight_decay: 5.0e-5

seed: 42
